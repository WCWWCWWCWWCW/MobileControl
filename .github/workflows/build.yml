name: Build MobileControl APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5  # 更新到 v5，支持 Node.js 24

      - name: Set up JDK 17
        uses: actions/setup-java@v5  # 更新到 v5，避免弃用警告
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4  # 从 v3 更新到 v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileControl-debug
          path: app/build/outputs/apk/debug/app-debug.apk
