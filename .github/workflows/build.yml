name: Build MobileControl APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 先用 JDK 17 满足 sdkmanager 的硬性要求
      - name: Set up JDK 17 (for Android SDK setup)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # v4 已修复 'tools' 包缺失问题，packages: '' 进一步确保不装默认包
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: '' # 跳过默认的 platform-tools，避免潜在冲突
        env:
          SKIP_JDK_VERSION_CHECK: true

      # 切回 JDK 11 用于 Gradle 构建（老项目兼容性更好）
      - name: Set up JDK 11 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.0.2'

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileControl-debug
          path: app/build/outputs/apk/debug/app-debug.apk
