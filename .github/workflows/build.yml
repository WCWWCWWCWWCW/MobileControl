name: Build MobileControl APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # 固定版本，避免 Ubuntu 26 迁移带来的不确定性
    steps:
      - name: Checkout code
        uses: actions/checkout@v5  # 升级，消除 Node.js 20 警告

      - name: Set up JDK 11
        uses: actions/setup-java@v5  # 升级，消除弃用警告
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileControl-debug
          path: app/build/outputs/apk/debug/app-debug.apk
