name: Build MobileControl APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'  # 2021年的项目通常兼容 JDK 11
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle (指定旧版本)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.0.2'  # 尝试 2021 年兼容的 Gradle 版本

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace  # --stacktrace 会打印更详细的错误

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileControl-debug
          path: app/build/outputs/apk/debug/app-debug.apk
